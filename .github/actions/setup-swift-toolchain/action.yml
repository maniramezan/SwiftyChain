name: Set up Swift toolchain
description: >
  Installs a swift.org toolchain with swiftly and puts it first on PATH. The toolchain
  builds against the SDK of the selected Xcode, so select Xcode before this step.

inputs:
  version:
    description: Swift release to install, for example 6.4.2.
    required: true

runs:
  using: composite
  steps:
    - name: Install swiftly
      shell: bash
      run: |
        curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/swiftly.pkg" \
          https://download.swift.org/swiftly/darwin/swiftly.pkg
        installer -pkg "${RUNNER_TEMP}/swiftly.pkg" -target CurrentUserHomeDirectory
        "${HOME}/.swiftly/bin/swiftly" init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
        echo "SWIFTLY_HOME_DIR=${HOME}/.swiftly" >> "${GITHUB_ENV}"
        echo "SWIFTLY_BIN_DIR=${HOME}/.swiftly/bin" >> "${GITHUB_ENV}"
        echo "${HOME}/.swiftly/bin" >> "${GITHUB_PATH}"

    - name: Install Swift ${{ inputs.version }}
      shell: bash
      run: |
        swiftly install "${{ inputs.version }}" --use --assume-yes
        swift --version
